<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a16">
<title>抽取灵感 · 灵感卡池</title>
<meta name="description" content="从灵感卡池里单抽或十连抽，看看这一发能抽到什么灵感。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1226'/%3E%3Cpath d='M16 6l2.6 6.9L26 16l-7.4 3.1L16 26l-2.6-6.9L6 16l7.4-3.1z' fill='%23ffb340'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css?v=3">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="stars" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <h1 id="pool-title">抽取灵感</h1>
    <p class="sub" id="pool-sub">单抽或十连抽，看看这一发能抽到什么。</p>
  </div>
  <div class="stats">
    <span class="stat">图鉴 <b id="stat-owned">0</b>/<span id="stat-total">0</span></span>
    <span class="stat">已抽 <b id="stat-draws">0</b> 次</span>
  </div>
</header>

<main class="stage" id="stage">
  <div class="empty" id="empty">
    <div class="empty-card"></div>
    <p class="empty-tip">点下面的按钮，抽一张灵感。</p>
    <p class="empty-note" id="empty-note">十连必得 ★3 以上</p>
  </div>
  <div class="cards" id="cards" hidden></div>
</main>

<footer class="actions">
  <div class="actions-inner">
    <button class="btn ghost" id="btn-prob" type="button">概率</button>
    <button class="btn ghost" id="btn-book" type="button">图鉴</button>
    <button class="btn primary" id="btn-one" type="button">单抽</button>
    <button class="btn gold" id="btn-ten" type="button">十连</button>
  </div>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="modal-close" id="modal-close" type="button" aria-label="关闭">×</button>
    </header>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="assets/app.js?v=3"></script>
</body>
</html>
